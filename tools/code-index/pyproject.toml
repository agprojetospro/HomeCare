[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homecare-code-index"
version = "0.1.0"
description = "Local Code Intelligence and Semantic Search Engine for HomeCare Codebase"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
homecare-index = "tools.code_index.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
